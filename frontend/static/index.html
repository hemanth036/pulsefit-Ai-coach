<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseCraft AI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  :root {
    --accent: #ff4757;
    --accent-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
    --bg-dark: #090d16;
    --panel-bg: rgba(15, 23, 42, 0.85);
    --bubble-agent: rgba(30, 41, 59, 0.95);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
    --border-accent: rgba(255, 71, 87, 0.3);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(at 0% 0%, rgba(255, 71, 87, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.4) 0px, transparent 50%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Header --- */
  header {
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon-wrapper {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
  }

  .brand-icon-wrapper .material-symbols-outlined {
    color: #fff;
    font-size: 1.4rem;
  }

  .brand-title {
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -0.2px;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.2);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #4ade80;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
  }

  /* --- Main Container & Log --- */
  #main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    height: calc(100vh - 70px);
    position: relative;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    scroll-behavior: smooth;
  }

  /* --- Messages --- */
  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: messageIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes messageIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .msg.user .avatar {
    background: var(--accent-gradient);
    color: #fff;
  }

  .msg.agent .avatar {
    background: #1e293b;
    border: 1px solid var(--border);
    color: var(--accent);
  }

  .avatar .material-symbols-outlined {
    font-size: 1.2rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 0.95rem;
    position: relative;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
    font-weight: 500;
  }

  .msg.agent .bubble {
    background: var(--bubble-agent);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    box-shadow: none;
  }

  /* --- Typing Indicator --- */
  .typing-indicator { display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; }
  .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulseDot 1.4s infinite ease-in-out; }
  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulseDot { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }

  /* --- Suggestions Chips --- */
  .suggestions {
    display: flex;
    gap: 0.6rem;
    padding: 0.5rem 1rem 0.75rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  
  .suggestions::-webkit-scrollbar { display: none; }

  .chip {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    color: #cbd5e1;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    backdrop-filter: blur(8px);
  }

  .chip:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 71, 87, 0.35);
  }

  .chip .material-symbols-outlined {
    font-size: 1.05rem;
    color: var(--accent);
    transition: color 0.2s ease;
  }

  .chip:hover .material-symbols-outlined {
    color: #fff;
  }

  /* --- Form & Input Bar --- */
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
  }

  .input-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 0.85rem 1.1rem;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    color: #fff;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.2);
    background: rgba(15, 23, 42, 1);
  }

  input::placeholder { color: var(--text-muted); }

  button {
    padding: 0.85rem 1.25rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255, 71, 87, 0.45);
  }

  button:active {
    transform: translateY(1px);
  }

  /* --- A2UI Cards Dark Glass Styling --- */
  .a2card {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 800; color: #fff; }
  .a2text.a2-h2 { font-size: 1.3rem; font-weight: 700; color: #fff; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border); }
  
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon-wrapper">
      <span class="material-symbols-outlined">ecg_heart</span>
    </div>
    <div class="brand-title">PulseCraft AI Coach</div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    <span>Active AI Agent</span>
  </div>
</header>

<div id="main-container">
  <div id="log"></div>

  <div class="suggestions">
    <button type="button" class="chip" onclick="fillPrompt(this.dataset.prompt)" data-prompt="Calculate heart rate zones for age 28 (resting HR 65)">
      <span class="material-symbols-outlined">favorite</span>
      <span>Calculate HR Zones</span>
    </button>
    <button type="button" class="chip" onclick="fillPrompt(this.dataset.prompt)" data-prompt="Suggest chest exercises for muscle building">
      <span class="material-symbols-outlined">fitness_center</span>
      <span>Chest Exercises</span>
    </button>
    <button type="button" class="chip" onclick="fillPrompt(this.dataset.prompt)" data-prompt="Generate an exercise preview card for squats">
      <span class="material-symbols-outlined">auto_awesome</span>
      <span>Exercise Card</span>
    </button>
  </div>

  <form id="form">
    <div class="input-wrapper">
      <input id="input" placeholder="Ask your AI coach anything..." autocomplete="off" autofocus>
    </div>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size: 1.1rem;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function fillPrompt(txt) {
  input.value = txt;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar");
  const icon = el("span", "material-symbols-outlined", who === "user" ? "person" : "ecg_heart");
  avatar.appendChild(icon);

  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);

  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); 
  b.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
